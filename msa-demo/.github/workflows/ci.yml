name: ci-cd
on: { push: { branches: [main] } }
jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [user-service, order-service, gateway] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/${{ matrix.service }}:${{ github.sha }}
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "kubectl set image deploy/<svc> <svc>=<image>:${{ github.sha }}"